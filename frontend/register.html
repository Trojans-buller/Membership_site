<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Register - Membership Site</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <div class="container">
        <div class="logo">🌿</div>
        <h2>Create Account</h2>
        <p class="subtitle">Join our community today</p>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Choose a unique username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="0712345678" required>
                <small>For M-Pesa payment verification</small>
            </div>
            
            <div class="form-group terms">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">I agree to the <a href="#" onclick="alert('Terms & Conditions')">Terms and Conditions</a></label>
            </div>
            
            <button type="submit" id="registerBtn" disabled>
                <span class="btn-text">Create Account</span>
                <span class="btn-loader">⏳ Creating...</span>
            </button>
        </form>
        
        <div id="message" style="display:none;"></div>
        <div class="login-link">Already have an account? <a href="login.html">Login</a></div>
    </div>
    
    <script src="js/register.js"></script>
</body>
</html>
